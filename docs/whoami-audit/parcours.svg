  <text x="56" y="49" class="eyebrow">WHOAMI / TOM BUZON</text>
  <text x="56" y="106" class="title">Entrer dans l’atelier. Suivre une pensée. Examiner les preuves.</text>
  <text x="56" y="141" class="copy">Plan de principe pour la refonte · Proposition avant implémentation · 9 octobre 2026</text>

