<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" style="width:100%;height:auto;display:block" role="img" aria-labelledby="title desc">
  <title id="title">Parcours proposé pour le portfolio WhoAmI de Tom Buzon</title>
  <desc id="desc">Trois zones reliées dans le grenier : le bureau pour le profil, une table pour la démarche et les compétences, puis une galerie pour les preuves. Le problème évolue selon Understand, Build, Test, Learn et Iterate autour de la même table. Schéma de conception, pas une capture du site réalisé.</desc>
