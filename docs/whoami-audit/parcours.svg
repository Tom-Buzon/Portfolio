  <text x="80" y="258" class="head">Le bureau personnel</text>
  <text x="514" y="219" class="eyebrow">02 / APPROACH &amp; SKILLS</text>
  <text x="514" y="258" class="head">Une table, cinq étapes</text>
  <text x="1006" y="219" class="eyebrow">03 / SELECTED WORK</text>
  <text x="1006" y="258" class="head">La galerie des réalisations</text>

