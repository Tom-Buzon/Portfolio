  <text x="1006" y="530" class="copy">Une preuve forte pour chaque projet.</text>
  <text x="1006" y="560" class="copy">Médias dans la pièce, détails sur place.</text>
  <text x="1006" y="603" class="small">CAMÉRA · entrée latérale courte,</text>
  <text x="1006" y="626" class="small">puis cadrages stables pendant la lecture.</text>

