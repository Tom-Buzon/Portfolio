  <text x="514" y="560" class="copy">Puis les liens s’ouvrent en Skill Map.</text>
  <text x="514" y="603" class="small">CAMÉRA · petit arc, avancée, recul.</text>
  <text x="514" y="626" class="small">Arrêt frontal pour l’exploration des compétences.</text>

