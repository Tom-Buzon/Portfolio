    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101d29"/><stop offset="1" stop-color="#090e15"/></linearGradient>
    <linearGradient id="lamp" x2="0" y2="1"><stop stop-color="#e5bc8c" stop-opacity=".25"/><stop offset="1" stop-color="#e5bc8c" stop-opacity="0"/></linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#e5bc8c" stroke-width="1.5"/></marker>
    <style>text{font-family:Arial,sans-serif;fill:#eef0e9}.eyebrow{font-family:Consolas,monospace;font-size:16px;letter-spacing:2px;fill:#e5bc8c}.title{font-size:39px;font-weight:600;letter-spacing:-1px}.head{font-size:28px;font-weight:600}.copy{font-size:19px;fill:#b4c1cf}.small{font-size:16px;fill:#8e9faf}.step{font-size:20px;font-weight:600;fill:#e5bc8c}.panel{fill:#101a24;stroke:#3d4c5b}.line{fill:none;stroke:#e5bc8c;stroke-width:2}.blue{fill:none;stroke:#8ec4d8;stroke-width:2}.node{fill:#101a24;stroke:#8ec4d8;stroke-width:2}</style>
  </defs>
