  <path d="M950 430H979" class="line" marker-end="url(#arrow)"/>
  <text x="56" y="704" class="eyebrow">LE FIL CONDUCTEUR / UN MÊME PROBLÈME SE TRANSFORME</text>

  <text x="80" y="757" class="step">01 / Understand</text><text x="80" y="788" class="small">Clarifier le besoin</text>
  <text x="360" y="757" class="step">02 / Build</text><text x="360" y="788" class="small">Coordonner et construire</text>
  <text x="640" y="757" class="step">03 / Test</text><text x="640" y="788" class="small">Confronter à l’usage</text>
  <text x="920" y="757" class="step">04 / Learn</text><text x="920" y="788" class="small">Interpréter les résultats</text>
  <text x="1190" y="757" class="step">05 / Iterate</text><text x="1190" y="788" class="small">Revoir l’approche</text>
  <path d="M284 749H333M541 749H613M804 749H893M1077 749H1163" class="line" marker-end="url(#arrow)"/>
  <path d="M1280 803V826H156V803" class="blue"/>
  <text x="720" y="822" text-anchor="middle" class="small" style="fill:#8ec4d8;paint-order:stroke;stroke:#0b131d;stroke-width:10">Le système évolue ; la caméra poursuit la visite.</text>

  <rect x="56" y="854" width="1328" height="1" fill="#3d4c5b"/>
  <text x="56" y="898" class="head">La 3D guide la découverte. Le contenu reste lisible.</text>
  <text x="56" y="937" class="copy">Accès direct Profile / Skills / Work · Projets avec URL · Lecture sur place · Aucun son automatique</text>
  <text x="56" y="973" class="copy">Sur mobile et en mouvement réduit : même histoire, déplacements simplifiés, preuves accessibles immédiatement.</text>
  <text x="56" y="1018" class="small">Schéma narratif non coté. Les positions et les dégagements seront validés dans la scène existante après accord.</text>
