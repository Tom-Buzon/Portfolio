<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" style="width:100%;height:auto;display:block" role="img" aria-labelledby="title desc">
  <title id="title">Plan de principe de la galerie de Tom Buzon</title>
  <desc id="desc">Six travées longent une allée continue : MnemeMind, Vesper et Hoplite, ClipGenerator, SFT, AtticAgentWatcher, puis Blender et Car AI. Les médias s'examinent dans leur poste et le détail se déplie dans la visite. Conception avant implémentation, sans échelle architecturale.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#14212c"/><stop offset="1" stop-color="#090f15"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#dfb783" stroke-width="1.6"/></marker>
    <style>text{font-family:Arial,sans-serif;fill:#edf0e9}.eyebrow{font-family:Consolas,monospace;font-size:16px;letter-spacing:2px;fill:#dfb783}.title{font-size:38px;font-weight:600}.h{font-size:23px;font-weight:600}.copy{font-size:18px;fill:#bdc9d3}.small{font-size:16px;fill:#98aab8}.panel{fill:#16232e;stroke:#465460;stroke-width:1}.screen{fill:#0a141c;stroke:#9eb8c7;stroke-width:2}.wood{fill:#674b35;stroke:#a07d56}.path{fill:none;stroke:#dfb783;stroke-width:3;marker-end:url(#arrow)}.dash{fill:none;stroke:#8da2b3;stroke-width:1.5;stroke-dasharray:5 5}</style>
  </defs>
  <rect width="1600" height="1120" fill="url(#bg)"/>
  <text x="54" y="45" class="eyebrow">WHOAMI / CONCEPTION DE LA GALERIE / 9 OCTOBRE 2026</text>
  <text x="54" y="100" class="title">Les réalisations habitent la pièce.</text>
  <text x="54" y="136" class="copy">Une visite continue. Des arrêts facultatifs. Le même poste pour découvrir, regarder et comprendre.</text>

