  <rect x="1160" y="181" width="386" height="650" rx="8" fill="#17212b" stroke="#465460"/>
  <text x="1185" y="216" class="eyebrow">LES DEGRÉS DE LECTURE</text>
  <text x="1185" y="270" class="h">1. Découvrir</text>
  <text x="1185" y="304" class="copy">Une preuve, un problème, un rôle.</text>
  <text x="1185" y="332" class="copy">Le scroll poursuit la visite.</text>
  <path d="M1200 351V382" class="path"/>
  <text x="1185" y="422" class="h">2. Examiner sur place</text>
  <text x="1185" y="456" class="copy">Rapprochement court du support.</text>
  <text x="1185" y="484" class="copy">Média net, décor encore visible.</text>
  <text x="1185" y="512" class="copy">La caméra se pose pour lire.</text>
  <path d="M1200 532V563" class="path"/>
  <text x="1185" y="603" class="h">3. Comprendre les choix</text>
  <text x="1185" y="637" class="copy">Le détail se déplie dans la page.</text>
  <text x="1185" y="665" class="copy">Un seul défilement pour lire.</text>
  <rect x="1185" y="705" width="334" height="55" rx="3" fill="#dfb783"/>
  <text x="1352" y="739" text-anchor="middle" font-size="19" style="fill:#13202b">Reprendre la visite →</text>
  <text x="1185" y="796" class="small">Même poste, même sélection.</text>

  <text x="54" y="889" class="eyebrow">MOBILIER À PRÉVOIR</text>
  <text x="54" y="930" class="copy">Poste MnemeMind à 3 supports · 2 cadres vidéo verticaux · Pupitre SFT · Supports son et carte</text>
  <text x="54" y="963" class="copy">Console double · Rail de processus · Cartels et index · Petit panneau Car AI · Onglets du carnet</text>
  <path d="M54 991H1546" stroke="#465460"/>
  <text x="54" y="1030" class="copy">Un seul lecteur actif · Aucun son automatique · Les 12 captures MnemeMind remplacent toute vidéo prévue</text>
  <text x="54" y="1072" class="small">Volumes et dégagements à valider après accord. Schéma narratif, pas une capture de la refonte réalisée.</text>
</svg>
